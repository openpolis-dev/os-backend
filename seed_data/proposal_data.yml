# select name from proposal_component_actions
proposal_component_actions:
  - command: project/create
  - command: project/close
  - command: guild/create
  - command: guild/close
  - command: reward/new_application
  - command: proposal/veto
  - command: reward/motivation
  - command: reject_action_1

# select pc.name, pc.schema, pc.is_hidden, pca.command as approve_action, pca2.command as reject_action
# from proposal_components pc
# left join proposal_component_actions pca on pc.approve_action_id =pca.id
# left join proposal_component_actions pca2 on pc.reject_action_id =pca2.id
proposal_components:
  - name: close_project
    schema: '{"title":"关闭项目申请","content":[{"type":"select","dataList":"datasrv/project_list","name":"project_info","properties":[{"name":"title","value":"项目名称"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action: project/close
    reject_action: reject_action_1
  - name: close_guild
    schema: '{"title":"关闭公会申请","content":[{"type":"select","dataList":"datasrv/guild_list","name":"guild_info","properties":[{"name":"title","value":"公会名称"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action: guild/close
    reject_action: reject_action_1
  - name: create_project
    schema: '{"title":"创建公共项目申请","content":[{"type":"input","inputType":"text","value":"","name":"project_name","properties":[{"name":"title","value":"项目名称"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action: project/create
    reject_action: reject_action_1
  - name: create_guild
    schema: '{"title":"创建公会申请","content":[{"type":"input","inputType":"text","value":"","name":"guild_name","properties":[{"name":"title","value":"公会名称"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action: guild/create
    reject_action: reject_action_1
  - name: deliverables
    schema: '{"type":"deliverables","title":"交付物","content":[{"type":"richText","value":"","name":"description","properties":[{"name":"title","value":"交付物"},{"name":"hint","value":"请注明交付物的类型或形式。（如线上讨论会1场
      / SNS 增长人数不少于50人 / 活动内容文稿宣传 1 篇 / 培训课程 pft 文档 1 份等）"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true,"pattern":"^<!--.*-->(.|\\n)+$|^(?!(<!--.*?-->))[\\s\\S]+$"}}]}]}'
    is_hidden: true
    approve_action:
    reject_action:
  - name: associate_proposal
    schema: '{"title":"关联提案","content":[{"type":"select","dataList":"datasrv/passed_proposals","name":"proposal","properties":[{"name":"title","value":"提案"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action:
    reject_action:
  - name: new_reward
    schema: '{"title":"资产申请","content":[{"type":"select","dataList":"datasrv/entity_list","name":"budget","properties":[{"name":"title","value":"预算来源"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]},{"type":"table","name":"receiverList","style":{"width":[20,15,15,20,30],"tHeader":["接收人","资产类型","资产数量","事项","备注"]},"rows":[{"type":"input","inputType":"address","value":"","name":"address","properties":[{"name":"title","value":"接收人"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"select","dataList":"datasrv/asset_type","value":"","name":"type","properties":[{"name":"title","value":"资产类型"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"input","inputType":"number","value":"","name":"amount","properties":[{"name":"title","value":"资产数量"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"input","inputType":"number","value":"","name":"issue","properties":[{"name":"title","value":"事项"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"input","inputType":"text","value":"","name":"memo","properties":[{"name":"title","value":"备注"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]}]},{"type":"input","inputType":"textarea","value":"","name":"description","properties":[{"name":"title","value":"说明"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: true
    approve_action: reward/new_application
    reject_action: reject_action_1
  - name: deadline
    schema: '{"type":"deadline","title":"计划完成时限","content":[{"type":"datepicker","value":"","name":"description","properties":[{"name":"title","value":"日期选择"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: true
    approve_action:
    reject_action:
  - name: relate
    schema: '{"title":"立项提案","type":"relate","content":[{"type":"input","inputType":"text","value":"","name":"relate","properties":[{"name":"title","value":"关联提案"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: true
    approve_action:
    reject_action:
  - name: reject
    schema: '{"type":"reject","title":"否决提案","content":[{"type":"select","dataList":"datasrv/can_be_vetoed_proposals","name":"proposal_info","properties":[{"name":"title","value":"提案名称"},{"name":"size","value":"lg"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action: proposal/veto
    reject_action: reject_action_1
  - name: budget_p1
    schema: '{"title":"预算申请(P1)","type":"budget_p1","desc":"P1 提案可申请不超过 20000 SCR
      的激励","content":[{"type":"input","inputType":"number","value":"","name":"amount","properties":[{"name":"title","value":"数额"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true,"max":20000}}]},{"type":"select","dataList":"datasrv/asset_type","value":{"id":1,"name":"SCR"},"name":"typeTest","properties":[{"name":"title","value":"资产类型"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]}]}'
    is_hidden: false
    approve_action:
    reject_action:
  - name: motivation
    schema: '{"type":"budget","title":"激励申请表","content":[{"type":"table","name":"budgetList","desc":"如果此项目有预付部分，请在以下表格中分配中剔除已预付的部分。","style":{"width":[20,20,20,40],"tHeader":["接收人","资产类型","资产数量","备注"]},"rows":[{"type":"input","inputType":"address","value":"","name":"address","properties":[{"name":"title","value":"接收人"},{"name":"size","value":"md"},{"name":"needParseSNS","value":true},{"name":"validate","value":{"required":true}}]},{"type":"select","dataList":"datasrv/asset_type","value":"","name":"assetInfo","properties":[{"name":"title","value":"资产类型"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"input","inputType":"number","value":"","name":"amount","properties":[{"name":"title","value":"资产数量"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true,"min":0}}]},{"type":"input","inputType":"text","value":"","name":"description","properties":[{"name":"title","value":"备注"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]}]}]}'
    is_hidden: true
    approve_action: reward/motivation
    reject_action: reject_action_1
  - name: budget
    schema: '{"type":"budget","title":"预算申请","content":[{"type":"table","name":"budgetList","desc":"P2
      提案可申请不超过 50000 SCR 、不超过 1000 USDT 的激励。目前预付只能选择U，且需要说明预付的具体使用途径。","style":{"width":[20,20,20,40],"tHeader":["申请数额","资产类型","预付比例(0-50%)","预付需求说明"]},"rows":[{"type":"input","inputType":"number","value":"","name":"amount","properties":[{"name":"title","value":"申请数额"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"select","dataList":"datasrv/asset_type","value":"","name":"typeTest","properties":[{"name":"title","value":"资产类型"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]},{"type":"input","inputType":"number","value":"","name":"proportion","properties":[{"name":"title","value":"预付比例"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true,"pattern":"^(?:[1-9]|[1-4]\\d|50|0)$"}}]},{"type":"input","inputType":"text","value":"","name":"description","properties":[{"name":"title","value":"预付需求说明"},{"name":"size","value":"md"},{"name":"validate","value":{"required":true}}]}]}]}'
    is_hidden: false
    approve_action:
    reject_action:

