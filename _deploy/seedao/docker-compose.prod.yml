version: "3"
services:
  os-backend:
    container_name: seedao-os-backend
    image: ghcr.io/seedao-polis/os-backend:main
    environment:
      - ENV_NAME=production
    restart: always
    volumes:
      - ./conf/os-backend/config.yml.prod:/conf/config.yml:ro
      - ./logs/os-backend/:/superapp-backend/logs:rw
      - ./conf/spp-indexer/data.db:/conf/spp-indexer/data.db:ro
      - ./export/os-backend/:/superapp-backend/export:rw
    entrypoint:
      [
        "/usr/local/bin/apiserver",
        "-casbin-model",
        "/superapp-backend/conf/rbac_model.conf",
        "-config",
        "/conf/config.yml"
      ]
    ports:
      - 9090:8080
    extra_hosts:
      - host.docker.internal:host-gateway

  spp-backend:
    container_name: seedao-spp-backend
    image: ghcr.io/seedao-polis/spp-profile-backend:master
    restart: always
    env_file:
      - conf/spp-backend/envfile.prod
    environment:
      - PORT=3000
    ports:
      - 9091:3000
    extra_hosts:
      - host.docker.internal:host-gateway

  sns_api:
    container_name: seedao-sns-api
    image: ghcr.io/seedao-polis/sns-safe-backend:main
    restart: always
    ports:
      - 9092:8090
    extra_hosts:
      - host.docker.internal:host-gateway

  spp-indexer:
    container_name: seedao-spp-indexer
    image: ghcr.io/seedao-polis/spp-indexer:main
    mem_limit: 4g
    restart: always
    ports:
      - 9094:3000
    env_file:
      - conf/spp-indexer/envfile.prod
    volumes:
      - ./conf/spp-indexer/data.db:/app/data.db:rw
    extra_hosts:
      - host.docker.internal:host-gateway

  spp-data-crawler:
    container_name: seedao-spp-data-crawler
    image: ghcr.io/seedao-polis/spp-chain-data-crawler:master
    restart: always
    ports:
      - 9095:3000
    environment:
      - CONFIG_PATH=/app/config.json
    volumes:
      - ./conf/spp-chain-data-crawler/config.json.prod:/app/config.json:ro
    command: ["node", "dist/index.js"]
    extra_hosts:
      - host.docker.internal:host-gateway

  scr-api:
    container_name: seedao-scr-api
    image: ghcr.io/seedao-polis/automint-api:main
    restart: always
    ports:
      - 9096:3000
    env_file:
      - conf/scr-api/envfile.prod
    volumes:
      - ./conf/scr-api/envfile.prod:/automint-api/.env
    extra_hosts:
      - host.docker.internal:host-gateway

  sbt-api:
    container_name: seedao-sbt-api
    image: ghcr.io/seedao-polis/sbt-api:main
    restart: always
    ports:
      - 9097:3000
    env_file:
      - conf/sbt-api/envfile.prod
    volumes:
      - ./conf/sbt-api/envfile.prod:/sbt-api/.env
    extra_hosts:
      - host.docker.internal:host-gateway

  ds-chat-backend:
    container_name: seedao-ds-chat-backend
    image: ghcr.io/seedao-polis/seedao-chat-backend:main
    restart: always
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - BASE_OPENWEBUI_URL=http://<openwebui_host>:3000
      - OPENWEBUI_API_KEY=<openwebui_api_key>
    ports:
      - 9098:3000
    extra_hosts:
      - host.docker.internal:host-gateway

