openapi: '3.0.2'
info:
  title: Super App API
  version: '1.0'
servers:
  - url: https://api.example.com/v1
paths:
  # /proposals:
  #   get:
  #     responses:
  #       '200':
  #         description: OK
  #   post:
  #     responses:
  #       '201':
  #         description: Created

  /user/login:
    post:
      tags: [ user ]
      summary: user login
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        400:
          description: verify signature error
        500:
          description: Find user record by wallet error
        200:
          description: user login successfully
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LoginResp"


  /user/users:
    get:
      tags: [ user ]
      summary: query multiple users by wallet
      parameters:
        - name: wallets
          in: query
          description: wallet address of users to be queried
          explode: true
          schema:
            type: array
            items:
              description: single wallet address
              type: string
      responses:
        500:
          description: got internal error
        200:
          description: return found users
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"


  /user/me:
    get:
      tags: [ user ]
      security:
        - bearerAuth: [ ]
      summary: get self user detail
      responses:
        200:
          description: return user detail data
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags: [ user ]
      security:
        - bearerAuth: [ ]
      summary: update user detail data
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        200:
          description: user profile updated successfully

  /user/logout:
    get:
      tags: [ user ]
      security:
        - bearerAuth: [ ]
      summary: logout user
      responses:
        200:
          description: OK

  /projects:
    get:
      tags: [ project ]
      summary: List all projects match the query params
      parameters:
        - name: page
          in: query
          description: which page
          schema:
            type: number
          required: false
        - name: size
          in: query
          description: size of each page
          schema:
            type: number
        - name: sort_field
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [ asc, desc ]
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  page:
                    type: number
                  size:
                    type: number
                  total:
                    type: number
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      tags: [ project ]
      summary: Create project
      requestBody:
        content:
          "application/json":
            schema:
              $ref: '#/components/schemas/NewProjectRequest'
      responses:
        '201':
          description: Created

  /projects/{id}:
    get:
      tags: [ project ]
      description: Show project detail
      parameters:
        - name: id
          in: path
          description: id of the project
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/Project'
                      budgets:
                        type: array
                        items:
                          $ref: "#/components/schemas/BudgetRecord"
    put:
      tags: [ project ]
      summary: Update project meta info
      parameters:
        - name: id
          in: path
          description: id of the project
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                logo:
                  type: string
                  description: project logo
                name:
                  type: string
                  description: project name
      responses:
        '200':
          description: project updated successfully

  /projects/{id}/close:
    post:
      tags: [ project ]
      description: create a close_project application, note this may be able to merged to application APIs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: ok

  /projects/my:
    get:
      tags: [ project ]
      description: list my projects
      parameters:
        - name: page
          in: query
          description: which page
          schema:
            type: number
          required: false
        - name: size
          in: query
          description: size of each page
          schema:
            type: number
        - name: sort_field
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [ asc, desc ]
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  page:
                    type: number
                  size:
                    type: number
                  total:
                    type: number
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

  /projects/{id}/update_sponsors:
    post:
      tags: [ project ]
      description: update sponsors for project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                sponsors:
                  type: array
                  items:
                    type: string
                    description: sponsor wallet address
      responses:
        '200':
          description: sponsor update

  /projects/{id}/update_member:
    post:
      tags: [ project ]
      description: Update member of the project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                members:
                  type: array
                  items:
                    type: string
                    description: member wallet address
      responses:
        '200':
          description: member update

  /projects/{id}/update_budget:
    post:
      tags: [ project ]
      description: Update budget of the project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: budget record ID
                asset_name:
                  type: string
                  description: budget asset name
                total_amount:
                  type: number
                  description: total amount of the budget
      responses:
        '200':
          description: budget updated

  /projects/{id}/add_related_proposal/{proposal_id}:
    post:
      tags: [ project ]
      description: add proposal to project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: proposal_id
          in: path
          required: true
          description: proposal ID that will be added to the project
          schema:
            type: string
      responses:
        200:
          description: proposal added to project successfully

