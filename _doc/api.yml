  /applications:
    get:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      summary: list all applications
      description: >
        The requests contains all type of requests listed above, which contains :
        * Project related:
          * Close project
        * Credit and Token
          * Credit reward
          * Token reward

        This API returns requests based on query params
      parameters:
        - name: page
          in: query
          description: which page
          schema:
            type: number
          required: false
        - name: size
          in: query
          description: size of each page
          schema:
            type: number
        - name: sort_field
          in: query
          schema:
            type: string
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [ asc, desc ]

      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  page:
                    type: number
                  size:
                    type: number
                  total:
                    type: number
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'

    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: create new application
      requestBody:
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/NewApplicationRequest"
      responses:
        '201':
          description: Created
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/Application"

  /applications/approve:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: approve multiple applications
      requestBody:
        content:
          "application/json":
            schema:
              type: array
              items:
                type: string
                description: application ID
      responses:
        '200':
          description: all applications are marked as approved
        '500':
          description: some applications are processing error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/export:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: Export application list that will be processed outside the system
      requestBody:
        content:
          "application/json":
            schema:
              type: array
              items:
                type: string
                description: application id
      responses:
        200:
          description: >
            Chosen applications has been exported successfully. All the exported application will be marked as
            processing state and no new export application can be issued if there are still records in processing state
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: number
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/Application"

  /applications/reject:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: reject multiple applications
      requestBody:
        content:
          "application/json":
            schema:
              type: array
              items:
                type: string
                description: id for application will be rejected

      responses:
        '200':
          description: all applications are marked as rejected
        '500':
          description: some applications are processing error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/complete:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: >
        complete multiple applications. Only application in processing mode can be completed,
        so this API call does not require application IDs
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: complete message, e.g. transactions ID for the rewards
      responses:
        '200':
          description: all applications are marked as completed
        '500':
          description: some applications are processing error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}:
    get:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: Show application detail
      responses:
        '200':
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}/approve:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: approve the application
      responses:
        '200':
          description: application has been approved

  /applications/{id}/complete:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: mark the application to be completed
      responses:
        '200':
          description: application has been marked as completed

  /applications/{id}/reject:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: reject the application
      responses:
        '200':
          description: application has been rejected

  /applications/{id}/process:
    post:
      tags: [ applications ]
      security:
        - bearerAuth: [ ]
      description: process the application
      responses:
        '200':
          description: application has been rejected


components:
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Proposal:
      type: object
      properties:
        id:
          type: string
          description: Proposal ID, prepare to use UUID

    Project:
      type: object
      properties:
        id:
          type: string
          description: uniq id for project
        logo:
          type: string
          description: logo of the project, can be base64 image or image url
        name:
          type: string
          description: name of the project
        status:
          type: string
          enum: [ open, pending_close, closed ]
          description: status of the project
        sponsors:
          description: project holder, may be one or more user address
          type: array
          items:
            type: string
        members:
          description: project member, the value is member ID
          type: array
          items:
            type: string
            description: user ID
        proposals:
          description: proposal IDs
          type: array
          items:
            type: string
            description: proposal ID

    BudgetRecord:
      description: Budget record
      type: object
      properties:
        id:
          type: number
          description: budget record ID
        project_id:
          type: string
          description: project ID this budget record is attached on
        name:
          type: string
          description: token name for this budget
        total_amount:
          type: integer
          description: total amount of the budget
        remain_amount:
          type: integer
          description: remain amount of the budget
        created_at:
          type: string
          description: budget record created at time
        updated_at:
          type: string
          description: budget record last update time

    BudgetAuditLog:
      description: budget change log
      type: object
      properties:
        id:
          type: string
          description: uniq id for budget audit log
        budget_id:
          type: string
          description: budget ID that this audit log belongs to
        timestamp:
          type: number
          description: opeation timestamp in millionsecond
        operator:
          type: string
          description: user ID for this operation
        pre_value:
          type: number
          description: value before this action
        post_value:
          type: number
          description: value after this action

    Application:
      description: application records require approval
      type: object
      properties:
        id:
          type: string
          description: uniq id for the application
        action:
          type: string
          enum: [ close_project, new_reward ]
          description: all supported actions currently
        requester:
          type: string
          description: wallet address of application sender
        state:
          type: string
          enum:
            - open  # new application which is waiting for reviewing
            - approved  # application has been approved
            - rejected  # application has been rejected
            - processing  # application is under processing, e.g. sending transaction on chain
            - completed # application has been completed
        rejected_reason:
          type: string
          description: why this application has been rejected
        created_at:
          type: number
          description: creation timestamp of this application
        updated_at:
          type: number
          description: update timestamp of this application
        detailed_data:
          type: string
          description: detailed data for this application, the fields are different based on action
        logs:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationAuditLog"

    ApplicationAuditLog:
      description: application audit log, save every actions performed on the application
      type: object
      properties:
        id:
          type: string
          description: uniq id for this audit log
        application_id:
          type: string
          description: id for application record
        timestamp:
          type: number
          description: timestamp in millionsecond for this operation
        operation:
          type: string
          enum: [ approve, reject, process, complete ]
          description: operation for the application
        operator:
          type: string
          description: who do the operation
        pre_state:
          type: string
          description: application state before this operation
        post_state:
          type: string
          description: application state after this operation
        extra_data:
          type: string
          description: Extra message required or passed with this audition


    User:
      type: object
      description: user information
      properties:
        id:
          type: string
          description: uniq ID for user
        avatar:
          type: string
        discord_url:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: number
        msg:
          type: string
        data:
          type: object
          description: detailed data for this error

    UserRewardRecord:
      type: object
      description: reward record for user
      properties:
        id:
          type: string
          description: uniq id for this reward record
        user_id:
          type: string
          description: user id
        entity_id:
          type: string
          description: record that related to this reward
        state:
          type: string
          enum: [ pending_review, processing, completed ]
          description: state of this reward
        reward_type:
          type: string
          description: type of this reward, `credit` or <token name>
        reward_amount:
          type: number
          description: amount of this reward
        created_at:
          type: number
          description: timesatmp this reward record created
        updated_at:
          type: number
          description: timesatmp this reward record updated

    LoginRequest:
      type: object
      properties:
        wallet:
          type: string
          required: true
        timestamp:
          type: number
          required: true
        sign:
          type: string
          required: true

    LoginResp:
      type: object
      properties:
        token:
          type: string
        tokenExp:
          type: number
          description: expiration timestamp for token
        user:
          $ref: "#/components/schemas/User"

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string
        email:
          type: string
        discordProfile:
          type: string
        twitterProfile:
          type: string
        GoogleProfile:
          type: string

    NewProjectRequest:
      type: object
      properties:
        logo:
          type: string
          description: logo URL or b64 encoded image
        name:
          type: string
          description: project name
        sponsors:
          type: array
          description: sponsors address
          items:
            type: string
            description: user wallet address
        members:
          type: array
          description: members address
          items:
            type: string
            description: user wallet address
        proposals:
          type: array
          description: proposals address
          items:
            type: string
            description: proposal address
        budgets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: budget asset name
              total_amount:
                type: string
                description: budget amount

    NewApplicationRequest:
      type: object
      properties:
        type:
          type: string
          enum: [ close_project, new_reward ]
        entity:
          type: string
          enum: [ project, guild ]
          description: which entity this application is used for
        entity_id:
          type: string
          description: entity ID for this application
        target_user_wallet:
          type: string
          description: which account should this reward be sent to
        asset_name:
          type: string
          description: which asset will be sent in this application
        amount:
          type: string
          description: how many asset will be sent
