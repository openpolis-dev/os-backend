host: https://test-api.seedao.tech
info:
  contact: {}
  license:
    name: MIT
  title: OS Backend API service
  version: "1.0"
paths:
  /app_bundle_approve:
    post:
      parameters:
      - description: app bundle IDs
        in: body
        name: JsonBody
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Approve app bundle and associated applications
      tags:
      - app_bundle
  /app_bundles:
    get:
      parameters:
      - description: which page
        in: query
        name: page
        type: string
      - description: size of each page
        in: query
        name: size
        type: string
      - description: sort by which field
        in: query
        name: sort_field
        type: string
      - description: order of sort
        in: query
        name: sort_order
        type: string
      - description: state of app bundle
        in: query
        name: state
        type: string
      - description: applicant of app bundle
        in: query
        name: applicant
        type: string
      - description: season id
        in: query
        name: season_id
        type: integer
      - description: entity name to be filter
        in: query
        name: entity
        type: string
      - description: entity id
        in: query
        name: entity_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_bundle.AppBundleResponseRecord'
      summary: List all application bundles match the query params
      tags:
      - app_bundle
    post:
      parameters:
      - description: New application bundle request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.NewAppBundleRequest'
      responses:
        "201":
          description: Created
          schema:
            type: string
      summary: Create app bundles based on request data
      tags:
      - app_bundle
  /app_bundles_reject:
    post:
      parameters:
      - description: app bundle IDs
        in: body
        name: JsonBody
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Reject app bundle and associated applications
      tags:
      - app_bundle
  /applications:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Reply'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ListReplyData'
                  - properties:
                      rows:
                        $ref: '#/definitions/model.FrontendApplicationRecord'
                    type: object
              type: object
      summary: lists all applications based on query params and return in JSON format
    post:
      parameters:
      - description: new application request
        in: body
        name: JsonBody
        required: true
        schema:
          items:
            $ref: '#/definitions/model.NewApplicationRequest'
          type: array
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: create single application, for now only CLOSE_PROJECT type is allowed
  /apps_applicants:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/application.ApplicantListResponse'
      summary: List all applicants existing in applications table for filter
  /available_projects_guilds:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Reply'
            - properties:
                data:
                  $ref: '#/definitions/app_bundle.ListAvailableProjectAndGuildResp'
              type: object
      summary: List available projects and guilds for current user
      tags:
      - app_bundle
  /cityhall/batch_update_members:
    post:
      parameters:
      - description: member data
        in: body
        name: JsonBody
        required: true
        schema:
          items:
            $ref: '#/definitions/city_hall.CityHallUpdateMemberReq'
          type: array
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: updates multiple group member info in single request, the logic is
        same with single update
  /cityhall/update_members:
    post:
      parameters:
      - description: member data
        in: body
        name: JsonBody
        required: true
        schema:
          $ref: '#/definitions/city_hall.CityHallUpdateMemberReq'
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: updates cityhall member, if group name existing in the request, the
        grouped sponsors field will be updated, otherwise the sponsors field will
        be updated
  /data_srv/aggr_scr:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/data_srv.CreditDetail'
            type: array
      summary: returns aggregated credit score and node calculation result
  /guilds:
    get:
      consumes:
      - application/json
      parameters:
      - description: 'page number, default: 1'
        in: query
        name: page
        type: integer
      - description: 'page size, default: 10'
        in: query
        name: size
        type: integer
      - description: 'sort field, default: created_at'
        in: query
        name: sort_field
        type: string
      - description: 'sort order, default: desc'
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Reply'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/api.ListReplyData'
                  - properties:
                      rows:
                        $ref: '#/definitions/model.Guild'
                    type: object
              type: object
      summary: List guilds
      tags:
      - Guild
    post:
      consumes:
      - application/json
      parameters:
      - description: request json body
        in: body
        name: JsonBody
        required: true
        schema:
          $ref: '#/definitions/guild.CreateReq'
      produces:
      - application/json
      responses:
        "200":
